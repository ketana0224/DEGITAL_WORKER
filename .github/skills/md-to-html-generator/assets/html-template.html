<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <style>
    :root {
      --color-bg: #fafafa;
      --color-surface: #ffffff;
      --color-primary: #1a73e8;
      --color-conclusion-bg: #e8f4fd;
      --color-conclusion-border: #1a73e8;
      --color-overview-bg: #f8f9fa;
      --color-text: #202124;
      --color-text-muted: #5f6368;
      --font-base: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      --radius: 8px;
      --shadow: 0 1px 4px rgba(0,0,0,.10);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-base);
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.75;
      font-size: 16px;
    }
    a { color: var(--color-primary); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── レイアウト ── */
    .page-wrapper {
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 16px 80px;
    }

    /* ── ページタイトル ── */
    .page-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--color-text);
    }
    .page-meta {
      font-size: 0.875rem;
      color: var(--color-text-muted);
      margin-bottom: 40px;
    }

    /* ── 目次 ── */
    .toc {
      background: var(--color-surface);
      border: 1px solid #e0e0e0;
      border-radius: var(--radius);
      padding: 24px 28px;
      margin-bottom: 48px;
      box-shadow: var(--shadow);
    }
    .toc h2 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--color-text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .toc ol {
      padding-left: 20px;
    }
    .toc li {
      margin-bottom: 6px;
      font-size: 0.9375rem;
    }

    /* ── 章カード ── */
    .chapter {
      background: var(--color-surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 40px;
      overflow: hidden;
    }
    .chapter-header {
      padding: 24px 28px 16px;
      border-bottom: 1px solid #f0f0f0;
    }
    .chapter-header h2 {
      font-size: 1.375rem;
      font-weight: 700;
      color: var(--color-text);
    }
    .chapter-header .chapter-num {
      font-size: 0.8125rem;
      color: var(--color-primary);
      font-weight: 600;
      margin-bottom: 4px;
    }

    /* ── ブロック共通 ── */
    .block { padding: 20px 28px; }
    .block + .block { border-top: 1px solid #f0f0f0; }
    .block-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    /* 概要ブロック */
    .overview { background: var(--color-overview-bg); }
    .overview .block-label { color: var(--color-text-muted); }

    /* 結論ブロック */
    .conclusion {
      background: var(--color-conclusion-bg);
      border-left: 4px solid var(--color-conclusion-border);
    }
    .conclusion .block-label { color: var(--color-primary); }
    .conclusion p { font-weight: 500; }

    /* 詳細ブロック */
    .detail {}
    .detail .block-label { color: var(--color-text-muted); }

    /* ── 本文要素 ── */
    .block p { margin-bottom: 0.75em; }
    .block p:last-child { margin-bottom: 0; }
    .block h3 { font-size: 1.0625rem; margin: 1em 0 0.5em; }
    .block ul, .block ol { padding-left: 1.5em; margin-bottom: 0.75em; }
    .block li { margin-bottom: 0.25em; }
    .block code {
      background: #f1f3f4;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.875em;
      font-family: 'Consolas', 'Menlo', monospace;
    }
    .block pre {
      background: #282c34;
      color: #abb2bf;
      padding: 16px 20px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 0.75em 0;
      font-size: 0.875rem;
      line-height: 1.6;
    }
    .block pre code { background: none; padding: 0; color: inherit; }
    .block table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9375rem;
      margin: 0.75em 0;
    }
    .block th, .block td {
      padding: 8px 12px;
      border: 1px solid #e0e0e0;
      text-align: left;
    }
    .block th { background: #f1f3f4; font-weight: 600; }

    /* ── フッター ── */
    .page-footer {
      margin-top: 64px;
      padding-top: 16px;
      border-top: 1px solid #e0e0e0;
      font-size: 0.8125rem;
      color: var(--color-text-muted);
      text-align: center;
    }

    /* ── レスポンシブ ── */
    @media (max-width: 600px) {
      .page-title { font-size: 1.5rem; }
      .block { padding: 16px; }
      .chapter-header { padding: 16px 16px 12px; }
      .toc { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">

    <h1 class="page-title">{{TITLE}}</h1>
    <p class="page-meta">生成日: {{DATE}}</p>

    <!-- 目次 -->
    <nav class="toc">
      <h2>目次</h2>
      <ol>
        {{TOC_ITEMS}}
        <!-- 例:
        <li><a href="#ch01">第 1 章タイトル</a></li>
        <li><a href="#ch02">第 2 章タイトル</a></li>
        -->
      </ol>
    </nav>

    <!-- 章ブロック（各章を繰り返す） -->
    {{CHAPTERS}}
    <!--
    章の出力例:
    <article class="chapter" id="ch01">
      <header class="chapter-header">
        <div class="chapter-num">第 1 章</div>
        <h2>章タイトル</h2>
      </header>

      <div class="block overview">
        <div class="block-label">概要</div>
        <p>この章では〇〇について説明します。〜です。</p>
      </div>

      <div class="block conclusion">
        <div class="block-label">結論・結果</div>
        <p>〇〇を使うことで△△が実現できます。</p>
      </div>

      <div class="block detail">
        <div class="block-label">詳細</div>
        <p>詳細な説明をここに記述します。</p>
      </div>
    </article>
    -->

    <footer class="page-footer">
      <p>このドキュメントは md-to-html-generator スキルによって生成されました。</p>
    </footer>

  </div>
</body>
</html>
